<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html,body{margin:0;padding:0;background:#ffffff;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:#18181b;text-decoration:none;}
  a:hover{color:#52525b;text-decoration:underline;}
  button,input{font-family:inherit;}
</style>
</helmet>
<main style="min-height:100vh;display:grid;grid-template-columns:340px 1fr;gap:48px;max-width:1480px;margin:0 auto;padding:64px 48px;box-sizing:border-box;">
  <div>
    <h1 style="font-size:24px;font-weight:600;letter-spacing:-0.02em;margin:0;">{{ greeting }}</h1>
    <div style="font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#a1a1aa;margin:44px 0 6px;">Today&rsquo;s summary</div>
    <div style="display:flex;flex-direction:column;">
      <sc-for list="{{ summary }}" as="row" hint-placeholder-count="3">
        <button onClick="{{ row.onClick }}" style="display:flex;align-items:center;gap:14px;background:none;border:none;border-bottom:1px solid #f1f1f3;padding:18px 4px;cursor:pointer;text-align:left;width:100%;" style-hover="background:#fafafa;">
          <span style="display:flex;color:#71717a;flex-shrink:0;" dangerouslySetInnerHTML="{{ row.icon }}"></span>
          <span style="font-size:20px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;width:52px;flex-shrink:0;color:#18181b;">{{ row.value }}</span>
          <span style="flex:1;font-size:14px;color:#3f3f46;">{{ row.label }}</span>
          <span style="display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid #e4e4e7;border-radius:50%;color:#71717a;flex-shrink:0;">
            <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M3 1.5L6.5 5 3 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
  <aside style="border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;min-height:640px;">
    <dc-import name="NotificationsView" hint-size="100%,640px" style="display:block;width:100%;"></dc-import>
  </aside>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 800}, &quot;userName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Emily&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;notifications&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 15, &quot;tsType&quot;: &quot;number&quot;}, &quot;assigned&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 72, &quot;tsType&quot;: &quot;number&quot;}, &quot;casesAdded&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 326, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {

  renderVals() {
    const ic = {
      bell: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.8a4 4 0 00-4 4c0 3.2-1.3 4.4-1.3 4.4h10.6S12 9 12 5.8a4 4 0 00-4-4z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.2 13a1.4 1.4 0 01-2.4 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
      folder: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.8 3.5A1.5 1.5 0 013.3 2h3l1.5 2h4.9a1.5 1.5 0 011.5 1.5v7A1.5 1.5 0 0112.7 14H3.3a1.5 1.5 0 01-1.5-1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
      plus: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.4v5.2M5.4 8h5.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
      call: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h2.5l1.2 3-1.6 1.2a9 9 0 004.2 4.2l1.2-1.6 3 1.2v2.5a1.5 1.5 0 01-1.6 1.5C6.4 14 2 9.6 1.5 4.1A1.5 1.5 0 013 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
      fax: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="6" width="12" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 6V2.5h6V6M5 10h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      appeal: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 14h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4.5 6.5L8 3l4.5 4.5L9 11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M10.2 9.7l3.3 3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
      send: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2L9.5 14l-2.5-5L2 6.5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      doc: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.5L13 5v9.5H4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 1.5V5H13" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 7v4M6.2 9.2L8 11l1.8-1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      person: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c.7-2.6 2.9-4 5.5-4s4.8 1.4 5.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
    };
    const summary = [
      { value: this.props.notifications ?? 15, label: 'Notifications', icon: ic.bell },
      { value: this.props.assigned ?? 72, label: 'Assigned to you', icon: ic.folder },
      { value: this.props.casesAdded ?? 326, label: 'Cases added', icon: ic.plus }
    ].map(r => ({ ...r, icon: { __html: r.icon }, onClick: () => {} }));
    return {
      greeting: 'Welcome back, ' + (this.props.userName ?? 'Emily'),
      summary
    };
  }
}
</script>
</body>
</html>
